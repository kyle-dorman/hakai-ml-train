name = "tiny_cpu"
experiment = "baseline"
paths_file = "../../paths.local.toml"
variant = "augmented"

# Machine paths are relative to this recipe; chips/assignments use data_root.
# Fixed with-BC normalization reference; preserve band order.
# Bounded smoke on the quickstart tiny-v2 outputs; change both paths together.
band_names = ["nir", "red", "green"]
mean = [799.2215816851071, 451.3045100567385, 465.35795980452735]
std = [994.5695551762033, 575.3320083210876, 459.22170495895057]
clip_value = 5000
chips = "examples/runs/my-tiny-v2-01-chips"
assignments = "examples/runs/my-tiny-v2-01-splits/assignments.csv"
epochs = 2
warmup_epochs = 1
seed = 42
learning_rate = 0.0003
min_lr = 3e-05
betas = [0.9, 0.95]
weight_decay = 0.01
batch_size = 1
accumulate_grad_batches = 2
gradient_clip_val = 0.8
accelerator = "cpu"
precision = "32-true"
encoder_weights = "none"
num_workers = 0
pin_memory = false
persistent_workers = false
limit_train_batches = 2
limit_val_batches = 1
wandb = false
