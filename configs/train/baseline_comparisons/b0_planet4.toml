# Task 037B: B0 with the reference training policy and a reduced band set.
name = "planet4-cabc-b0-spectral-037b-70ep"
experiment = "baseline"
paths_file = "../../../paths.local.toml"
variant = "augmented"

# Machine paths are relative to this recipe; chips/assignments use data_root.
# Fixed with-BC normalization reference; preserve band order.
band_names = ["red", "green", "blue", "nir"]
mean = [451.3045100567385, 465.35795980452735, 389.5317689154827, 799.2215816851071]
std = [575.3320083210876, 459.22170495895057, 336.1495661091302, 994.5695551762033]
clip_value = 5000
chips = "data/chips/ca_bc/v1"
assignments = "data/splits/ca_bc/v1/assignments.csv"
epochs = 70
warmup_epochs = 5
# Stop after twenty validation checks without improved IoU; zero disables stopping.
# The full 70-epoch LR schedule remains unchanged even when stopping early.
early_stopping_patience = 20
early_stopping_min_delta = 0.0
# Human-readable completed epoch numbers; best/last are retained separately.
checkpoint_epochs = [4, 5, 6, 7, 8, 9, 10, 11, 12]
seed = 42
learning_rate = 0.00015
min_lr = 3e-06
betas = [0.9, 0.95]
weight_decay = 0.01
batch_size = 12
accumulate_grad_batches = 2
gradient_clip_val = 0.8
accelerator = "cuda"
precision = "bf16-mixed"
deterministic = false
encoder_name = "mit_b0"
encoder_weights = "imagenet"
num_workers = 8
pin_memory = true
persistent_workers = true
limit_train_batches = 1.0
limit_val_batches = 1.0
wandb = true

[[losses]]
type = "bce"
name = "bce"
weight = 0.7
parameters = { smoothing = 0.0, pos_weight = 1.0, reduction = "mean", per_image = false }

[[losses]]
type = "dice"
name = "dice"
weight = 0.3
parameters = { smooth = 0.0, eps = 1e-07, log_loss = false, per_image = false }
