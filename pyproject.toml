[project]
name = "kelpseg"
version = "0.1.0"
description = "Researcher-friendly binary kelp segmentation on Planet imagery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "albumentations==2.0.8",
    "lightning>=2.5.1,<2.6.2",
    "matplotlib>=3.10.5,<4",
    "numpy>=2,<3",
    "opencv-python-headless>=4.13.0.92",
    "pyogrio>=0.11,<1",
    "pyproj>=3.7,<4",
    "rasterio>=1.4,<2",
    "scipy>=1.15,<2",
    "segmentation-models-pytorch>=0.5.0,<0.6",
    "shapely>=2,<3",
    "torch>=2.11.0",
    "torchmetrics>=1.7.3,<2",
    "typer>=0.25.1,<0.26",
    "wandb>=0.21.0",
]

[project.scripts]
kelpseg = "kelpseg.cli:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "PyYAML>=6,<7",
    "pytest>=8.4.2",
    "ruff>=0.11.2",
    "uv_build>=0.12.12,<0.13",
]
[tool.ruff.lint]
extend-select = [
    "B",
    "SIM",
    "I",
    "T100",
]

[tool.pytest.ini_options]
pythonpath = ["."]
