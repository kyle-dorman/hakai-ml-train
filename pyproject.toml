[project]
name = "kelpseg"
version = "0.1.0"
description = "Researcher-friendly binary kelp segmentation on Planet imagery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "rasterio>=1.4,<2",
    "typer>=0.25.1,<0.26",
]

[project.scripts]
kelpseg = "kelpseg.cli:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pytest>=8.4.2",
    "ruff>=0.11.2",
    "uv_build>=0.12.12,<0.13",
]
legacy = [
    "albumentations>=2.0.8",
    "huggingface-hub>=1.4.1",
    "jsonargparse[signatures]>=4.49,<5",
    "lightning>=2.5.1,<2.6.2",
    "matplotlib>=3.10.5",
    "numpy>=2,<3",
    "opencv-python-headless>=4.13.0.92",
    "PyYAML>=6,<7",
    "segmentation-models-pytorch>=0.5.0",
    "shapely>=2,<3",
    "torch>=2.11.0",
    "torchmetrics>=1.7.3",
    "torchvision>=0.26.0",
    "tqdm>=4.67.1",
    "wandb>=0.21.0",
]

[tool.uv]
default-groups = ["dev", "legacy"]

[tool.ruff.lint]
extend-select = [
    "B",
    "SIM",
    "I",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
